backend {
  default = Local

  providers {
    

    Local {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        max-concurrent-workflows = 1
        concurrent-job-limit = 8

        filesystems {
          local {
            localization: [
              "soft-link", "hard-link", "copy"
            ]
            caching {
              duplication-strategy: [
                "soft-link", "hard-link", "copy"
              ]
            }
          }
        }

      }
    }

    HtCondor {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        runtime-attributes = """
          Int cpu = 1
          Float memory_mb = 512.0
          Float disk_kb = 256000.0
          String? nativeSpecs
          String? docker
        """

        # If an 'exit-code-timeout-seconds' value is specified:
        # - check-alive will be run at this interval for every job
        # - if a job is found to be not alive, and no RC file appears after this interval
        # - Then it will be marked as Failed.
        # exit-code-timeout-seconds = 120

        submit = """
          chmod 755 ${script}

          CALL_DIR=$(dirname ${cwd})

          # transfer_input_files = execution, inputs requires both dirs to
          # exist; tasks with no localized inputs won't have inputs/ unless
          # we create it.
          mkdir -p $CALL_DIR/inputs

          # Rewrite cromwell's absolute call-dir paths to $_CONDOR_SCRATCH_DIR
          # so they resolve correctly on the execute node. Don't use './'
          # paths — script.sh `cd`s into execution/ partway through, which
          # would break later relative refs to inputs/ and execution/<file>.
          # \$_CONDOR_SCRATCH_DIR is escaped so bash on the cromwell host
          # leaves it literal; it's expanded at runtime by bash on the worker.
          sed -i "s|$CALL_DIR|\$_CONDOR_SCRATCH_DIR|g" ${script}

          cat > ${cwd}/submitFile <<EOF
          universe                = vanilla
          Iwd                     = $CALL_DIR
          executable              = execution/$(basename ${script})
          transfer_executable     = false
          should_transfer_files   = YES
          when_to_transfer_output = ON_EXIT
          transfer_input_files    = execution, inputs
          transfer_output_files   = execution
          output                  = execution/stdout
          error                   = execution/stderr
          log                     = execution/execution.log
          log_xml                 = true
          leave_in_queue          = true
          request_memory          = ${memory_mb}
          request_disk            = ${disk_kb}
          request_cpus            = ${cpu}
          requirements            = ${nativeSpecs}
          queue
          EOF

          ssh maule2@ap2001.chtc.wisc.edu "condor_submit ${cwd}/submitFile"
        """

        submit-docker = """
          chmod 755 ${script}

          CALL_DIR=$(dirname ${cwd})
          DOCKER_CALL_DIR=$(dirname ${docker_cwd})

          mkdir -p $CALL_DIR/inputs

          # When a docker runtime attribute is set, cromwell bakes in-container
          # paths (rooted at ${docker_cwd}) into script.sh rather than host
          # paths. Rewrite that in-container call-dir prefix the same way as
          # the non-docker submit: every reference becomes rooted at
          # $_CONDOR_SCRATCH_DIR. HTCondor's docker universe sets that env
          # var inside the container to the bind-mounted scratch dir, so the
          # rewritten paths resolve correctly inside the container.
          sed -i "s|$DOCKER_CALL_DIR|\$_CONDOR_SCRATCH_DIR|g" ${script}

          cat > ${cwd}/submitFile <<EOF
          universe                = docker
          docker_image            = ${docker}
          Iwd                     = $CALL_DIR
          executable              = execution/$(basename ${script})
          transfer_executable     = false
          should_transfer_files   = YES
          when_to_transfer_output = ON_EXIT
          transfer_input_files    = execution, inputs
          transfer_output_files   = execution
          output                  = execution/stdout
          error                   = execution/stderr
          log                     = execution/execution.log
          log_xml                 = true
          leave_in_queue          = true
          request_memory          = ${memory_mb}
          request_disk            = ${disk_kb}
          request_cpus            = ${cpu}
          requirements            = ${nativeSpecs}
          queue
          EOF

          ssh maule2@ap2001.chtc.wisc.edu "condor_submit ${cwd}/submitFile"
        """

        kill         = "ssh maule2@ap2001.chtc.wisc.edu condor_rm ${job_id}"
        check-alive  = "ssh maule2@ap2001.chtc.wisc.edu condor_q ${job_id}"
        job-id-regex = "(?sm).*cluster (\\d+)..*"
      }
    }

    SlurmSingularity {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        filesystems {
           local {
             localization: [
                   "hard-link", "copy"
             ]
           }
        },
        max-concurrent-workflows = 1
        concurrent-job-limit = 5
        runtime-attributes = """
        String? time
        Int? cpu
        String? mem
        String? docker
        """

        submit = """
            sbatch \
              --wait \
              -J ${job_name} \
              -D ${cwd} \
              -o ${out} \
              -e ${err} \
              --time ${time} \
              --ntasks ${cpu} \
              --nodes=1 \
              --mem ${mem} \
              --wrap "/bin/bash ${script}"
        """

         submit-docker = """

            export SINGULARITY_CACHEDIR=$SCRATCH/.singularity
            export SINGULARITY_TMPDIR=$SCRATCH/temp

            module load WebProxy # load the Singularity

            # Make sure the SINGULARITY_CACHEDIR variable is set. If not use a default
            # based on the users home.
            if [ -z $SINGULARITY_CACHEDIR ];
                then CACHE_DIR=$SCRATCH/.singularity
                else CACHE_DIR=$SINGULARITY_CACHEDIR
            fi

            # Build the Docker image into a singularity image
            DOCKER_NAME=$(sed -e 's/[^A-Za-z0-9._-]/_/g' <<< ${docker})

            # The image will live together with all the other images to force "caching" of the .sif files themselves - note, always use docker hub tags!!!

            IMAGE=$SINGULARITY_CACHEDIR/$DOCKER_NAME.sif

            if [ ! -f $IMAGE ]; then  # If we already have the image, skip everything
                singularity pull $IMAGE docker://${docker}
            fi

            echo -e "#!/bin/sh\nsingularity exec --containall --bind ${cwd}:${docker_cwd} $IMAGE ${job_shell} ${docker_script}" > ${cwd}/script_${job_name}.sh

            # Submit the script to SLURM
            sbatch \
              --wait \
              -J ${job_name} \
              -D ${cwd} \
              -o ${cwd}/execution/stdout \
              -e ${cwd}/execution/stderr \
              --time ${time} \
              --ntasks=${cpu} \
              --nodes=1 \
              --mem=${mem} \
              --export=NONE \
              ${cwd}/script_${job_name}.sh
        """

        kill = "scancel ${job_id}"
        check-alive = "squeue -j ${job_id}"
        job-id-regex = "Submitted batch job (\\d+).*"
      }
    }

    SGE {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        max-concurrent-workflows = 1
        concurrent-job-limit = 5
        runtime-attributes = """
        String? time
        Int? cpu
        String? mem
        String? docker
        """

        submit-docker = """
        # Ensure singularity is loaded if it's installed as a module
        module --ignore-cache load singularity
        export OMP_NUM_THREADS=1
        export MKL_NUM_THREADS=1
        export OMP_PLACES=threads
        export OMP_PROC_BIND=spread

        # Add here docker hub info if there are private repos

        # Submit the script to PBS
        qsub -A UQ-QAAFI \
          -l select=1:ncpus=${cpu}:mem=${mem} \
          -l walltime=${time} \
          bash -c "singularity exec --bind ${cwd}:${docker_cwd} docker://${docker} bash ${docker_cwd}/execution/script"
        """

        kill = "qdel ${job_id}"
        check-alive = "qstat -j ${job_id}"
        job-id-regex = "Submitted batch job (\\d+).*"
      }
    }

    SlurmDocker {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        max-concurrent-workflows = 1
	      # number of jobs
        concurrent-job-limit = 2
        runtime-attributes = """
          String? time
          Int? cpu
          String? mem
          String? docker
        """

        submit-docker = """
        # Submit the script to SLURM
        sbatch \
          -J ${job_name} \
          -D ${cwd} \
          -o ${cwd}/execution/stdout \
          -e ${cwd}/execution/stderr \
          --time ${time} \
          --ntasks ${cpu} \
          --nodes=1 \
          --mem ${mem} \
          --export=NONE \
          --wrap "docker run -v ${cwd}:${docker_cwd} ${docker} bash ${docker_cwd}/execution/script"
        """

        kill = "scancel ${job_id}"
        check-alive = "squeue -j ${job_id}"
        job-id-regex = "Submitted batch job (\\d+).*"
      }
    }

    HtCondor {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        runtime-attributes = """
          Int cpu = 1
          Float memory_mb = 4096.0
          Float disk_kb = 10000000.0
          String? nativeSpecs
          String? docker
        """

        # If an 'exit-code-timeout-seconds' value is specified:
        # - check-alive will be run at this interval for every job
        # - if a job is found to be not alive, and no RC file appears after this interval
        # - Then it will be marked as Failed.
        # Warning: If set, Cromwell will run 'check-alive' for every job at this interval

        # exit-code-timeout-seconds = 120

        submit = """
          chmod 755 ${script}
          cat > ${cwd}/execution/submitFile <<EOF
          Iwd=${cwd}/execution
          requirements=${nativeSpecs}
          leave_in_queue=true
          request_memory=${memory_mb}
          request_disk=${disk_kb}
          error=${err}
          output=${out}
          log_xml=true
          request_cpus=${cpu}
          executable=${script}
          log=${cwd}/execution/execution.log
          queue
          EOF
          condor_submit ${cwd}/execution/submitFile
        """

        submit-docker = """
          chmod 755 ${script}
          cat > ${cwd}/execution/dockerScript <<EOF
          #!/bin/bash
          docker run --rm -i -v ${cwd}:${docker_cwd} ${docker} /bin/bash ${script}
          EOF
          chmod 755 ${cwd}/execution/dockerScript
          cat > ${cwd}/execution/submitFile <<EOF
          Iwd=${cwd}/execution
          requirements=${nativeSpecs}
          leave_in_queue=true
          request_memory=${memory_mb}
          request_disk=${disk_kb}
          error=${cwd}/execution/stderr
          output=${cwd}/execution/stdout
          log_xml=true
          request_cpus=${cpu}
          executable=${cwd}/execution/dockerScript
          log=${cwd}/execution/execution.log
          queue
          EOF
          condor_submit ${cwd}/execution/submitFile
        """

        kill = "condor_rm ${job_id}"
        check-alive = "condor_q ${job_id}"
        job-id-regex = "(?sm).*cluster (\\d+)..*"
      }
    }
  }
}

database {
  profile = "slick.jdbc.PostgresProfile$"
  pgLargeObjectWriteRole = "cromwell"
  db {
      driver = "org.postgresql.Driver"
      url = "jdbc:postgresql://localhost:5432/cromwell"
      user = "cromwell"
      password = "vcru"
      port = 5432
      connectionTimeout = 5000
  }
}

call-caching {
  enabled = true
  invalidate-bad-cache-results = true
}

docker {
    perform-registry-lookup-if-digest-is-provided = false
}
